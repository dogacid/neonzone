[package]
name = "neonzone"
version = "0.1.0"
edition = "2021"
description = "A neon wireframe tank simulator that dresses itself in your Omarchy theme"
license = "MIT"

[dependencies]
wgpu = "25"
winit = "0.30"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.29", features = ["bytemuck"] }
toml = "0.8"
notify = "7"
anyhow = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
